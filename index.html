  <style>

    }
    html,body { background:var(--navy); color:var(--white); font-family:'Inter',sans-serif; min-height:100vh; overflow-x:hidden; }

    header {
      display:flex; align-items:center; justify-content:space-between;

<script type="module">
import * as THREE          from 'three';
import { GLTFLoader }      from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ════════════════════════════════════════════════════════════════════
//  CATALOGUE
// ════════════════════════════════════════════════════════════════════
const GLASSES = [
  {
    name : 'Classic',
    path : '3dmodel/classic/model.glb',
    thumb: '3dmodel/classic/thumb.svg',
    yFix : 0,
    rotFix: [0, 0, 0],
    mm: { frameWidth: 140 },
  },
  {
    name : 'Noir',
    path : '3dmodel/noir/model.glb',
    thumb: '3dmodel/noir/thumb.svg',
    yFix : 0,
    rotFix: [0, 0, 0],
    mm: { frameWidth: 140 },
  },
];

// ════════════════════════════════════════════════════════════════════
//  ONE EURO FILTER
// ════════════════════════════════════════════════════════════════════
class LP { constructor(){this.y=null;} f(x,a){this.y=this.y===null?x:a*x+(1-a)*this.y;return this.y;} }
class OneEuro {
  constructor(mc=1,b=0.05,dc=1){this.mc=mc;this.b=b;this.dc=dc;this.x=new LP();this.dx=new LP();this.lt=null;this.lx=null;}
  a(c,dt){const tau=1/(2*Math.PI*c);return 1/(1+tau/dt);}
  f(x,t){
    if(this.lt===null){this.lt=t;this.lx=x;this.x.f(x,1);return x;}
    const dt=Math.max(1e-3,(t-this.lt)/1000);
    const dx=(x-this.lx)/dt;
    const edx=this.dx.f(dx,this.a(this.dc,dt));
    const y=this.x.f(x,this.a(this.mc+this.b*Math.abs(edx),dt));
    this.lt=t;this.lx=x;return y;
  }
}

// ════════════════════════════════════════════════════════════════════
//  ÉTAT
// ════════════════════════════════════════════════════════════════════
const W=640, H=480, ASPECT=W/H, VFOV=63, D=200;
const OVAL=[10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
const N_OV=OVAL.length;
const OCC_IDX=(()=>{const a=[];for(let i=0;i<N_OV;i++)a.push(N_OV,i,(i+1)%N_OV);return new Uint32Array(a);})();

// ═══════════════════════════════════════════════════════════════════
//  LANDMARKS ANATOMIQUES POUR LE REPÈRE TÊTE 3D
//  Référence MediaPipe Face Mesh 478 (avec iris)
//   168 = sellion (pont nasal sup, entre les sourcils)
//   234 = tragus gauche (oreille G)
//   454 = tragus droit (oreille D)
//   10  = sommet du front
//   152 = pointe du menton
//
//  OFFSET local des lunettes dans le repère tête :
//  Les lunettes doivent reposer ~2cm sous le sellion (au niveau des yeux)
// ═══════════════════════════════════════════════════════════════════
// nasion (lm 6) = vrai point de contact du pont des lunettes sur le nez
// (entre les yeux, sur l'arête nasale supérieure, plus bas que le sellion)
const HEAD_LM = { nasion:6, sellion:168, earL:234, earR:454, top:10, chin:152 };
// Plus d'offsets : la géométrie auto-détectée du modèle place le pont
// exactement sur le nasion.
const GLASSES_OFFSET_Y_CM = 0;
const GLASSES_OFFSET_Z_CM = 0;

let renderer, scene, camera, occMesh;
let glassGroup=null, glassLoading=false;
let stream=null, animId=null;
let faceMesh=null, mpTimer=null, mpReady=false, mpSending=false, landmarks=null;
let selectedIdx=0;
let occBuf=null, occInit=false;

const F={
  tx:new OneEuro(2.0,0.10), ty:new OneEuro(2.0,0.10), tz:new OneEuro(1.0,0.02),
  // Rotation : cutoff + beta plus élevés = très réactif
  yw:new OneEuro(3.0,0.30), pt:new OneEuro(3.0,0.30), rl:new OneEuro(3.5,0.30),
  sc:new OneEuro(0.8,0.005),
};

const $=id=>document.getElementById(id);
const hud=(m,c='')=>{$('hud').textContent=m;$('hud').style.color=c;};

// ════════════════════════════════════════════════════════════════════
//  UI : sélecteur de monture
// ════════════════════════════════════════════════════════════════════
function buildSelector(){
  const row=$('frames');
  GLASSES.forEach((g,i)=>{
    const el=document.createElement('div');
    el.className='g-thumb'+(i===0?' active':'');
    el.innerHTML=`<img src="${g.thumb}" alt="${g.name}"><div class="gname">${g.name}</div>`;
    el.addEventListener('click',()=>selectGlass(i));
    row.appendChild(el);
  });
}

async function selectGlass(idx){
  selectedIdx=idx;
  document.querySelectorAll('.g-thumb').forEach((el,i)=>el.classList.toggle('active',i===idx));
  if(scene) await loadGlass(idx);
}

// ════════════════════════════════════════════════════════════════════
//  THREE.JS — scène en cm, FOV 63°
// ════════════════════════════════════════════════════════════════════
function initThree(){
  const cv=$('glCanvas');
  cv.width=W; cv.height=H;
  renderer=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});
  renderer.setClearColor(0,0);
  renderer.setSize(W,H,false);
  renderer.sortObjects=true;
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.2;

  camera=new THREE.PerspectiveCamera(VFOV,ASPECT,1,2000);
  camera.position.set(0,0,0); camera.lookAt(0,0,-1);

  scene=new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff,1.0));
  const k=new THREE.DirectionalLight(0xfff5e0,1.4); k.position.set(0,100,200); scene.add(k);
  const f=new THREE.DirectionalLight(0xe0ecff,0.6); f.position.set(-100,30,100); scene.add(f);

  const pmrem=new THREE.PMREMGenerator(renderer);
  scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
  pmrem.dispose();

  occMesh=new THREE.Mesh(
    new THREE.BufferGeometry(),
    new THREE.MeshBasicMaterial({colorWrite:false,depthWrite:true,side:THREE.DoubleSide})
  );
  occMesh.renderOrder=0; occMesh.visible=false; occMesh.frustumCulled=false;
  scene.add(occMesh);
}

// ════════════════════════════════════════════════════════════════════
//  CHARGEMENT GLB
// ════════════════════════════════════════════════════════════════════
async function loadGlass(idx){
  if(glassLoading) return;
  glassLoading=true;
  if(glassGroup){scene.remove(glassGroup);glassGroup=null;}

  const cfg=GLASSES[idx];
  const loader=new GLTFLoader();

  try{
    const gltf=await loader.loadAsync(cfg.path);
    const model=gltf.scene;

    // Supprimer les lights/cameras parasites (Sketchfab) qui faussent la bbox
    const trash=[];
    model.traverse(n=>{ if(n.isLight||n.isCamera) trash.push(n); });
    trash.forEach(n=>n.parent?.remove(n));

    if(cfg.rotFix?.some(v=>v)) model.rotation.set(...cfg.rotFix);
    model.updateMatrixWorld(true);

    // Mesure SEULEMENT à partir des meshes visibles
    const meshBox=new THREE.Box3();
    model.traverse(n=>{
      if(n.isMesh && n.geometry){
        n.geometry.computeBoundingBox();
        const b=n.geometry.boundingBox.clone().applyMatrix4(n.matrixWorld);
        meshBox.union(b);
      }
    });
    const s0=meshBox.getSize(new THREE.Vector3());
    console.log('[GLB]', cfg.name, 'taille native:', s0.x.toFixed(3), s0.y.toFixed(3), s0.z.toFixed(3));

    // Mise à l'échelle physique : largeur réelle = frameWidth mm → cm
    const targetCm=cfg.mm.frameWidth/10;
    const sc=targetCm/(s0.x||1);
    model.scale.set(sc,sc,sc);
    model.updateMatrixWorld(true);

    // Recalculer bbox APRÈS scaling, toujours sur les meshes seulement
    const meshBox2=new THREE.Box3();
    model.traverse(n=>{
      if(n.isMesh && n.geometry){
        const b=n.geometry.boundingBox.clone().applyMatrix4(n.matrixWorld);
        meshBox2.union(b);
      }
    });
    const s1=meshBox2.getSize(new THREE.Vector3());
    const c1=meshBox2.getCenter(new THREE.Vector3());
    console.log('[GLB] après scaling:', s1.x.toFixed(2), s1.y.toFixed(2), s1.z.toFixed(2),'cm');

    // Auto-détection du pont : vertex le plus bas dans la bande centrale
    // en X (= point où la monture touche réellement le nez).
    // Bien plus précis que la mi-hauteur géométrique car les modèles ont
    // souvent des plaquettes ou une découpe centrale.
    const centerBand = (meshBox2.max.x - meshBox2.min.x) * 0.08;
    let bridgeY = Infinity;
    const _bv = new THREE.Vector3();
    model.traverse(n => {
      if (!n.isMesh || !n.geometry) return;
      const pa = n.geometry.attributes.position;
      if (!pa) return;
      for (let i = 0; i < pa.count; i++) {
        _bv.fromBufferAttribute(pa, i).applyMatrix4(n.matrixWorld);
        if (Math.abs(_bv.x) < centerBand && _bv.y < bridgeY) {
          bridgeY = _bv.y;
        }
      }
    });
    if (!isFinite(bridgeY)) bridgeY = (meshBox2.max.y + meshBox2.min.y) / 2;
    console.log('[GLB] pont auto-détecté Y =', bridgeY.toFixed(2), 'cm');

    // Ancrage : X centré, pont au nasion, face arrière (min.z) au contact
    model.position.set(
      -c1.x,
      -bridgeY + (cfg.yFix||0)/10,
      -meshBox2.max.z + (cfg.zFix||0)/10
    );

    glassGroup=new THREE.Group();
    glassGroup.rotation.order='YXZ';
    glassGroup.renderOrder=1;
    glassGroup.add(model);
    scene.add(glassGroup);


  }catch(e){
    hud('❌ GLB: '+e.message,'#e57373');
    console.error('loadGlass',e);
  }
  glassLoading=false;
}


// ════════════════════════════════════════════════════════════════════
//  MEDIAPIPE
// ════════════════════════════════════════════════════════════════════
async function initMP(){
  hud('Chargement IA…');

  if(typeof FaceMesh === 'undefined'){
    hud('❌ FaceMesh manquant','#e57373');
    return;
  }

  const base = './node_modules/@mediapipe/face_mesh/';

  faceMesh=new FaceMesh({locateFile:f=>base+f});
  faceMesh.setOptions({
    maxNumFaces:1,
    refineLandmarks:true,
    minDetectionConfidence:0.6,
    minTrackingConfidence:0.6,
  });

  faceMesh.onResults(res=>{
    if(res.multiFaceLandmarks?.length){
      landmarks=res.multiFaceLandmarks[0];
      hud('✓ Visage détecté','#4caf50');
      $('faceOval').classList.add('detected','gone');
    }else{
      landmarks=null;
      if(occMesh) occMesh.visible=false;
      hud('Montrez votre visage à la caméra');
      $('faceOval').classList.remove('detected','gone');
    }
  });

  await faceMesh.initialize();
  mpReady=true;
  hud('Montrez votre visage à la caméra');

  mpTimer=setInterval(async()=>{
    if(!mpReady||mpSending||$('cam').readyState<2) return;
    mpSending=true;
    try{ await faceMesh.send({image:$('cam')}); }catch(_){}
    mpSending=false;
  },34);
}

// ════════════════════════════════════════════════════════════════════
//  TRACKING 6DOF
// ════════════════════════════════════════════════════════════════════
// ─────────────────────────────────────────────────────────────────
//  PROJECTION LANDMARK → POSITION 3D (cm) DANS LA SCÈNE THREE.JS
//  lm.x, lm.y normalisés [0..1] → coordonnées world à profondeur D
//  lm.z relatif → décalage Z par rapport au plan moyen du visage
// ─────────────────────────────────────────────────────────────────
function project3D(lm, halfW, halfH){
  const zScale = 2 * halfW;
  return new THREE.Vector3(
     (lm.x - 0.5) * 2 * halfW,
    -(lm.y - 0.5) * 2 * halfH,
    -D - lm.z * zScale
  );
}

// ─────────────────────────────────────────────────────────────────
//  REPÈRE TÊTE 3D RIGIDE — méthode professionnelle (Banuba / FittingBox)
//
//  À partir de 5 landmarks anatomiques on construit une base
//  orthonormale (X, Y, Z) attachée à la tête :
//   • X = vecteur tempe G → tempe D  (axe transversal)
//   • Y = construit par double produit vectoriel (vertical anatomique)
//   • Z = perpendiculaire à X et Y (axe sagittal, sortant du visage)
//   • Origine = sellion (pont nasal supérieur)
//
//  Cette base encode parfaitement la pose tête : roll, pitch, yaw
//  sortent ensemble sans calcul d'angles séparés. Robuste jusqu'à 90°.
// ─────────────────────────────────────────────────────────────────
const _tmpV = new THREE.Vector3();
const _xAxis = new THREE.Vector3();
const _yAxis = new THREE.Vector3();
const _zAxis = new THREE.Vector3();
const _yTemp = new THREE.Vector3();
const _headMat = new THREE.Matrix4();
const _glassMat = new THREE.Matrix4();
const _offsetMat = new THREE.Matrix4();
const _decPos = new THREE.Vector3();
const _decQuat = new THREE.Quaternion();
const _decScl = new THREE.Vector3();
const _decEul = new THREE.Euler(0,0,0,'YXZ');
const _finalQuat = new THREE.Quaternion();

function buildHeadMatrix(lm, halfW, halfH){
  const nasion  = project3D(lm[HEAD_LM.nasion],  halfW, halfH);
  const earL    = project3D(lm[HEAD_LM.earL],    halfW, halfH);
  const earR    = project3D(lm[HEAD_LM.earR],    halfW, halfH);
  const top     = project3D(lm[HEAD_LM.top],     halfW, halfH);
  const chin    = project3D(lm[HEAD_LM.chin],    halfW, halfH);

  // Axe X : tempe gauche → tempe droite
  _xAxis.subVectors(earR, earL).normalize();
  // Axe Y temporaire : menton → sommet (vertical approximatif)
  _yTemp.subVectors(top, chin).normalize();
  // Axe Z : produit vectoriel → vrai axe sortant du visage
  _zAxis.crossVectors(_xAxis, _yTemp).normalize();
  // Axe Y final : recomposé pour garantir l'orthogonalité parfaite
  _yAxis.crossVectors(_zAxis, _xAxis).normalize();

  // Origine = nasion (arête nasale supérieure, contact réel du pont)
  _headMat.makeBasis(_xAxis, _yAxis, _zAxis);
  _headMat.setPosition(nasion);
  return _headMat;
}

function track(lm){
  if(!glassGroup) return;

  const halfH = D * Math.tan(VFOV * Math.PI / 360);
  const halfW = halfH * ASPECT;

  // ── 1. Construire le repère tête 3D rigide ──────────────────
  const headMat = buildHeadMatrix(lm, halfW, halfH);

  // ── 2. Échelle physique
  // Priorité : largeur du visage (zygion-à-zygion ≈ 14 cm)
  //   → matche directement la largeur de la monture
  // Fallback : PD inter-iris (6.3 cm) si les ears sont occlus
  _tmpV.subVectors(
    project3D(lm[HEAD_LM.earR], halfW, halfH),
    project3D(lm[HEAD_LM.earL], halfW, halfH)
  );
  let sc = _tmpV.length() / 14.0;
  if(!isFinite(sc) || sc < 0.1){
    if(lm[468] && lm[473]){
      _tmpV.subVectors(
        project3D(lm[468], halfW, halfH),
        project3D(lm[473], halfW, halfH)
      );
      sc = _tmpV.length() / 6.3;
    }
  }
  sc = Math.max(0.3, Math.min(8.0, sc));

  // ── 3. Offset local : descendre les lunettes du sellion ─────
  //  vers le niveau des yeux (le sellion est entre les sourcils,
  //  le pont des lunettes est ~2cm plus bas)
  _offsetMat.makeTranslation(0, GLASSES_OFFSET_Y_CM, GLASSES_OFFSET_Z_CM);

  // Matrice finale : tête × offset
  _glassMat.copy(headMat).multiply(_offsetMat);

  // ── 4. Décomposer pour filtrer chaque composante ────────────
  _glassMat.decompose(_decPos, _decQuat, _decScl);
  _decEul.setFromQuaternion(_decQuat, 'YXZ');

  const t = performance.now();
  const fx  = F.tx.f(_decPos.x, t);
  const fy  = F.ty.f(_decPos.y, t);
  const fz  = F.tz.f(_decPos.z, t);
  const fyw = F.yw.f(_decEul.y, t);
  const fpt = F.pt.f(_decEul.x, t);
  const frl = F.rl.f(_decEul.z, t);
  const fsc = F.sc.f(sc, t);

  // ── 5. Appliquer la pose filtrée ────────────────────────────
  _finalQuat.setFromEuler(new THREE.Euler(fpt, fyw, frl, 'YXZ'));
  glassGroup.position.set(fx, fy, fz);
  glassGroup.quaternion.copy(_finalQuat);
  glassGroup.scale.setScalar(fsc);

  updateOcc(lm, halfW, halfH);
}

function updateOcc(lm,halfW,halfH){
  const vc=N_OV+1;
  if(!occBuf||occBuf.length!==vc*3) occBuf=new Float32Array(vc*3);
  const zScale=2*halfW;
  let cx=0,cy=0,cz=0;
  for(let i=0;i<N_OV;i++){
    const p=lm[OVAL[i]];
    const pz=-D-p.z*zScale;
    const k=Math.abs(pz)/D;
    const px=(p.x-0.5)*2*halfW*k;
    const py=-(p.y-0.5)*2*halfH*k;
    occBuf[i*3]=px; occBuf[i*3+1]=py; occBuf[i*3+2]=pz;
    cx+=px; cy+=py; cz+=pz;
  }
  occBuf[N_OV*3]=cx/N_OV; occBuf[N_OV*3+1]=cy/N_OV; occBuf[N_OV*3+2]=cz/N_OV;
  const geo=occMesh.geometry;
  if(!occInit){
    geo.setAttribute('position',new THREE.BufferAttribute(occBuf.slice(),3));
    geo.setIndex(new THREE.BufferAttribute(OCC_IDX,1));
    occInit=true;
  }else{
    geo.attributes.position.array.set(occBuf);
    geo.attributes.position.needsUpdate=true;
  }
  geo.computeBoundingSphere();
  occMesh.visible=true;
}

// ════════════════════════════════════════════════════════════════════
//  BOUCLE
// ════════════════════════════════════════════════════════════════════
function loop(){
  animId=requestAnimationFrame(loop);
  if(landmarks) track(landmarks);
  renderer.clear();
  renderer.render(scene,camera);
}

// ════════════════════════════════════════════════════════════════════
//  ÉVÉNEMENTS UI
// ════════════════════════════════════════════════════════════════════
$('startBtn').addEventListener('click',async()=>{
  $('welcome').style.display='none';
  $('app').classList.add('on');
  $('loading').classList.add('on');

  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user',width:{ideal:W},height:{ideal:H}},audio:false
    });
    $('cam').srcObject=stream;
    await new Promise((ok,fail)=>{$('cam').onloadedmetadata=ok;setTimeout(()=>fail(new Error('Timeout caméra')),15000);});
    await $('cam').play();
    $('loading').classList.remove('on');

    initThree();
    await loadGlass(selectedIdx);
    loop();
    initMP().catch(e=>{
      hud('❌ initMP: '+e.message,'#e57373');
      console.error(e);
    });

  }catch(e){
    console.error(e);
    $('loadMsg').style.color='#e57373';
    $('loadMsg').textContent='❌ '+(e.message||'Erreur');
    document.querySelector('.spinner').style.display='none';
  }
});

$('stopBtn').addEventListener('click',()=>{
  if(animId){cancelAnimationFrame(animId);animId=null;}
  if(mpTimer){clearInterval(mpTimer);mpTimer=null;}
  if(faceMesh){try{faceMesh.close();}catch(_){}faceMesh=null;}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  landmarks=null; occInit=false; occBuf=null; mpReady=false;
  $('cam').srcObject=null;
  if(renderer){renderer.dispose();renderer=null;}
  glassGroup=null; occMesh=null; scene=null; camera=null;
  $('app').classList.remove('on');
  $('welcome').style.display='';
  $('loadMsg').style.color=''; $('loadMsg').textContent='Démarrage caméra…';
  $('loading').classList.remove('on');
});

$('captureBtn').addEventListener('click',()=>{
  const out=document.createElement('canvas');
  out.width=W; out.height=H;
  const ctx=out.getContext('2d');
  ctx.save(); ctx.translate(W,0); ctx.scale(-1,1);
  ctx.drawImage($('cam'),0,0,W,H);
  ctx.drawImage($('glCanvas'),0,0,W,H);
  ctx.restore();
  const a=document.createElement('a');
  a.download=`NOA-${GLASSES[selectedIdx].name}-${Date.now()}.png`;
  a.href=out.toDataURL('image/png'); a.click();
});

$('confirmBtn').addEventListener('click',()=>{
  const t=$('toast');
  t.textContent=`✓ ${GLASSES[selectedIdx].name} sélectionnée`;
  t.style.display='block';
  setTimeout(()=>t.style.display='none',3500);
});


buildSelector();
</script>
