<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N.O.A — Essayage Virtuel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --navy:#0a1628; --navy2:#0f1f3d; --gold:#c9a84c; --gold2:#e2c97e;
      --white:#f0f4f8; --muted:#7a8ba3; --border:rgba(201,168,76,.18); --green:#4caf50;
    }
    html,body { background:var(--navy); color:var(--white); font-family:'Inter',sans-serif; min-height:100vh; overflow-x:hidden; }

    header {
      display:flex; align-items:center; justify-content:space-between;
      padding:.75rem 2rem; background:rgba(15,31,61,.92);
      border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100;
    }
    .logo-area { display:flex; align-items:center; gap:1rem; }
    .logo-noa  { font-family:'Playfair Display',Georgia,serif; font-size:1.7rem; font-weight:700; color:var(--gold); letter-spacing:.12em; }
    .logo-sep  { width:1px; height:2rem; background:var(--border); }
    .logo-sub  { font-size:.6rem; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); line-height:1.5; }
    .logo-sub strong { color:var(--gold2); display:block; font-size:.72rem; }
    .badge { display:flex; align-items:center; gap:.45rem; background:rgba(201,168,76,.08); border:1px solid var(--border); border-radius:50px; padding:.3rem .9rem; font-size:.7rem; color:var(--gold2); }
    .dot   { width:7px; height:7px; background:var(--green); border-radius:50%; animation:blink 2s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    main { display:flex; flex-direction:column; align-items:center; padding:1.5rem 1rem; gap:1.25rem; }

    #welcome { display:flex; flex-direction:column; align-items:center; gap:1.5rem; max-width:580px; text-align:center; padding:3rem 1rem; }
    .w-icon  { width:80px; height:80px; background:linear-gradient(135deg,rgba(201,168,76,.2),rgba(201,168,76,.05)); border:1px solid var(--border); border-radius:24px; display:flex; align-items:center; justify-content:center; font-size:2.2rem; }
    .w-title { font-family:'Playfair Display',Georgia,serif; font-size:2rem; color:var(--gold); }
    .w-sub   { font-size:.95rem; color:var(--muted); line-height:1.7; }
    .btn-start { display:inline-flex; align-items:center; gap:.6rem; padding:1rem 2.5rem; background:var(--gold); color:var(--navy); border:none; border-radius:50px; font-family:inherit; font-size:1.05rem; font-weight:700; cursor:pointer; box-shadow:0 8px 32px rgba(201,168,76,.3); }
    .btn-start:hover { background:var(--gold2); }

    #app { display:none; flex-direction:column; align-items:center; gap:1rem; width:100%; }
    #app.on { display:flex; }

    .cam-wrap { position:relative; display:inline-block; line-height:0; }
    #cam      { display:block; width:640px; height:480px; transform:scaleX(-1); background:#000; border-radius:12px; }
    #glCanvas  { position:absolute; top:0; left:0; width:640px; height:480px; transform:scaleX(-1); pointer-events:none; border-radius:12px; }
    #dbgCanvas { position:absolute; top:0; left:0; width:640px; height:480px; transform:scaleX(-1); pointer-events:none; z-index:8; display:none; }

    .face-oval {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-54%);
      width:190px; height:250px; border:2px dashed rgba(201,168,76,.35);
      border-radius:50%; pointer-events:none; transition:all .4s;
    }
    .face-oval.detected { border-color:rgba(76,175,80,.5); }
    .face-oval.gone     { opacity:0; }

    .hud {
      position:absolute; top:.75rem; left:50%; transform:translateX(-50%);
      background:rgba(10,22,40,.88); border:1px solid rgba(255,255,255,.1);
      border-radius:50px; padding:.3rem 1rem; font-size:.76rem; color:var(--muted);
      pointer-events:none; white-space:nowrap; z-index:10; max-width:90%;
      overflow:hidden; text-overflow:ellipsis;
    }

    .loading-overlay {
      display:none; position:absolute; inset:0; border-radius:12px;
      background:rgba(10,22,40,.92); align-items:center; justify-content:center;
      flex-direction:column; gap:1rem; z-index:50; text-align:center;
    }
    .loading-overlay.on { display:flex; }
    .spinner { width:36px; height:36px; border:3px solid rgba(201,168,76,.2); border-top-color:var(--gold); border-radius:50%; animation:spin .9s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .panel { width:100%; max-width:660px; display:flex; flex-direction:column; gap:.9rem; }
    .section-card { background:var(--navy2); border:1px solid var(--border); border-radius:16px; padding:.9rem 1rem; }
    .sec-label { font-size:.6rem; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:var(--gold); margin-bottom:.65rem; }

    /* Grille kiosque : 5 colonnes fixes, tout visible, pas de scroll */
    .frames-grid {
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap:.55rem;
    }
    .g-tile {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      min-height:88px;
      background:rgba(255,255,255,.04); border:2px solid rgba(255,255,255,.08);
      border-radius:14px; cursor:pointer; overflow:hidden;
      transition:border-color .15s, background .15s, transform .1s, box-shadow .15s;
      padding:.5rem .4rem .45rem;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
    }
    .g-tile:hover  { border-color:var(--gold); background:rgba(201,168,76,.07); }
    .g-tile:active { transform:scale(.96); }
    .g-tile.active {
      border-color:var(--gold); background:rgba(201,168,76,.15);
      box-shadow:0 0 0 3px rgba(201,168,76,.25), 0 4px 20px rgba(201,168,76,.2);
    }
    .g-tile img   { width:100%; height:52px; object-fit:contain; display:block; flex-shrink:0; }
    .g-tile-name  {
      font-size:.72rem; font-weight:700; text-align:center;
      color:var(--white); margin-top:.35rem; letter-spacing:.04em;
      line-height:1;
    }
    .g-tile.active .g-tile-name { color:var(--gold2); }


    .actions { display:flex; gap:.75rem; flex-wrap:wrap; justify-content:center; }
    .btn { padding:.7rem 1.4rem; border:none; border-radius:50px; font-family:inherit; font-size:.88rem; font-weight:600; cursor:pointer; }
    .btn-primary { background:var(--gold); color:var(--navy); flex:1; max-width:260px; padding:.85rem; font-size:.95rem; }
    .btn-ghost   { background:rgba(255,255,255,.07); color:var(--white); border:1px solid rgba(255,255,255,.12); }
    .btn-danger  { background:rgba(231,76,60,.1); color:#e57373; border:1px solid rgba(231,76,60,.2); }

    .toast { display:none; position:fixed; bottom:2rem; left:50%; transform:translateX(-50%); background:rgba(76,175,80,.15); border:1px solid rgba(76,175,80,.3); border-radius:50px; padding:.65rem 1.4rem; font-size:.84rem; color:#81c784; z-index:9999; }

    footer { text-align:center; padding:.6rem; font-size:.6rem; color:rgba(240,244,248,.15); }
  </style>
</head>

<script type="module">
import * as THREE          from 'three';
import { GLTFLoader }      from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ════════════════════════════════════════════════════════════════════
//  CATALOGUE
// ════════════════════════════════════════════════════════════════════
const GLASSES = [
  {
    name : 'Classic',
    id   : 'classic',
    path : '3dmodel/classic/model.glb',
    thumb: '3dmodel/classic/thumb.svg',
    yFix : 0,
    rotFix: [0, 0, 0],
    mm: { frameWidth: 140 },
  },
  {
    name : 'Noir',
    id   : 'noir',
    path : '3dmodel/noir/model.glb',
    thumb: '3dmodel/noir/thumb.svg',
    yFix : 0,
    rotFix: [0, 0, 0],
    mm: { frameWidth: 140 },
  },
  {
    name : 'Urban',
    id   : 'glasses11',
    path : '3dmodel/glasses11/model.glb',
    thumb: '3dmodel/glasses11/thumb.svg',
    yFix : 0,
    rotFix: [0, 0, 0],
    mm: { frameWidth: 140 },
  },
  {
    name : 'Supra',
    id   : 'glasses12',
    path : '3dmodel/glasses12/model.glb',
    thumb: '3dmodel/glasses12/thumb.svg',
    yFix : 0,
    rotFix: [0, 0, 0],
    mm: { frameWidth: 140 },
  },
  {
    name : 'Sahel',
    id   : 'glasses13',
    path : '3dmodel/glasses13/model.glb',
    thumb: '3dmodel/glasses13/thumb.svg',
    yFix : 0,
    rotFix: [0, 0, 0],
    mm: { frameWidth: 140 },
  },
];

// ════════════════════════════════════════════════════════════════════
//  ONE EURO FILTER
// ════════════════════════════════════════════════════════════════════
class LP { constructor(){this.y=null;} f(x,a){this.y=this.y===null?x:a*x+(1-a)*this.y;return this.y;} }
class OneEuro {
  constructor(mc=1,b=0.05,dc=1){this.mc=mc;this.b=b;this.dc=dc;this.x=new LP();this.dx=new LP();this.lt=null;this.lx=null;}
  a(c,dt){const tau=1/(2*Math.PI*c);return 1/(1+tau/dt);}
  f(x,t){
    if(this.lt===null){this.lt=t;this.lx=x;this.x.f(x,1);return x;}
    const dt=Math.max(1e-3,(t-this.lt)/1000);
    const dx=(x-this.lx)/dt;
    const edx=this.dx.f(dx,this.a(this.dc,dt));
    const y=this.x.f(x,this.a(this.mc+this.b*Math.abs(edx),dt));
    this.lt=t;this.lx=x;return y;
  }
}

// ════════════════════════════════════════════════════════════════════
//  ÉTAT
// ════════════════════════════════════════════════════════════════════
const W=640, H=480, ASPECT=W/H, VFOV=63, D=200;
// Pinhole-camera focal length (px) derived from the renderer's vertical FOV.
// Used to convert pixel-space landmarks into metric world coordinates that
// match the THREE.PerspectiveCamera projection exactly.
const FOCAL_PX = (H / 2) / Math.tan((VFOV * Math.PI / 180) / 2);
// Canonical inter-iris distance for an adult human (cm). Combined with the
// observed iris-to-iris pixel distance from MediaPipe, gives us a true
// metric depth Z for the head — no more constant D fudge.
const REAL_PD_CM = 6.3;
// Distance Z courante (cm) du visage à la caméra. Mise à jour à chaque frame.
let CURRENT_DEPTH_CM = 50;
// Occlusion = mesh facial complet MediaPipe (468 points, ~900 triangles)
// Construit dynamiquement depuis FACEMESH_TESSELATION (liste des arêtes)
const OCC_N_VERTS = 468;
let OCC_IDX = null;  // Uint32Array des indices de triangles, calculé une fois

// Repli minimal (ovale facial) si FACEMESH_TESSELATION indisponible
const OVAL_FALLBACK=[10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];

function buildFaceMeshTriangles(edges){
  // edges: tableau de paires [a,b]
  const nbr = new Map();
  const add = (a,b) => {
    let s = nbr.get(a);
    if(!s){ s = new Set(); nbr.set(a,s); }
    s.add(b);
  };
  for(const [a,b] of edges){ add(a,b); add(b,a); }

  const seen = new Set();
  const tris = [];
  for(const [a,b] of edges){
    const na = nbr.get(a), nb = nbr.get(b);
    for(const c of na){
      if(c === b || !nb.has(c)) continue;
      // Triangle (a,b,c) — normaliser pour déduper
      const lo = a<b ? (a<c?a:c) : (b<c?b:c);
      const hi = a>b ? (a>c?a:c) : (b>c?b:c);
      const mid = a+b+c - lo - hi;
      const key = lo*1000000 + mid*1000 + hi;
      if(seen.has(key)) continue;
      seen.add(key);
      tris.push(a,b,c);
    }
  }
  return new Uint32Array(tris);
}

// ═══════════════════════════════════════════════════════════════════
//  LANDMARKS ANATOMIQUES POUR LE REPÈRE TÊTE 3D
//  Référence MediaPipe Face Mesh 478 (avec iris)
//   168 = sellion (pont nasal sup, entre les sourcils)
//   234 = tragus gauche (oreille G)
//   454 = tragus droit (oreille D)
//   10  = sommet du front
//   152 = pointe du menton
//
//  OFFSET local des lunettes dans le repère tête :
//  Les lunettes doivent reposer ~2cm sous le sellion (au niveau des yeux)
// ═══════════════════════════════════════════════════════════════════
// nasion (lm 6) = vrai point de contact du pont des lunettes sur le nez
// (entre les yeux, sur l'arête nasale supérieure, plus bas que le sellion)
const HEAD_LM = { nasion:6, sellion:168, earL:234, earR:454, top:10, chin:152 };
// Plus d'offsets : la géométrie auto-détectée du modèle place le pont
// exactement sur le nasion.
// Offsets dans le repère tête (cm, métriques réels grâce à la profondeur Z PnP).
//   Y < 0 = descendre depuis le nasion vers la racine du nez
//   Z > 0 = pousser hors du visage vers la caméra (le pont des lunettes
//           repose juste devant l'os nasal, pas à l'intérieur du crâne)
// Nasion (lm 6) = entre les sourcils sur l'arête nasale supérieure.
// Les lunettes reposent ~1.2cm plus bas (pont nasal) et 0.2cm en avant du nez.
const GLASSES_OFFSET_Y_CM = -1.2;
const GLASSES_OFFSET_Z_CM = 0.20;

let renderer, scene, camera, occMesh;
let glassGroup=null, glassLoading=false;
let stream=null, animId=null;
let faceMesh=null, mpTimer=null, mpReady=false, mpSending=false, landmarks=null;
let selectedIdx=0;
let occBuf=null, occInit=false;

const F={
  tx:new OneEuro(4.0,0.20), ty:new OneEuro(4.0,0.20), tz:new OneEuro(2.0,0.05),
  yw:new OneEuro(5.0,0.50), pt:new OneEuro(5.0,0.50), rl:new OneEuro(6.0,0.50),
  sc:new OneEuro(1.5,0.010),
};

// Kalman 1D léger (processus + bruit mesure)
class Kalman1D {
  constructor(q=0.001, r=0.01){ this.q=q; this.r=r; this.x=0; this.p=1; this._init=false; }
  update(z){ if(!this._init){this.x=z;this._init=true;return z;}
    this.p+=this.q; const k=this.p/(this.p+this.r); this.x+=k*(z-this.x); this.p*=(1-k); return this.x; }
}
const KF={
  tx:new Kalman1D(0.0015,0.004), ty:new Kalman1D(0.0015,0.004), tz:new Kalman1D(0.0008,0.002),
};

// Lissage temporel des landmarks (IIR, alpha = réactivité)
let _prevLm = null;
const LM_ALPHA = 0.65;

// Filtre dédié sur la profondeur Z (inter-iris → très bruyant)
// L'oscillation Z = 47-56cm crée un zoom/dézoom continu visible.
const _depthFilter = new OneEuro(3.0, 0.03);
let _depthInited = false;

// Quaternion SLERP — remplace le filtre Euler (évite gimbal lock)
const _smoothQuat = new THREE.Quaternion();
let _quatInited = false;
const SLERP_ALPHA = 0.35;  // 0=figé, 1=brut — 0.35 = ~3 frames de lissage

const $=id=>document.getElementById(id);
const hud=(m,c='')=>{$('hud').textContent=m;$('hud').style.color=c;};

// ════════════════════════════════════════════════════════════════════
//  UI : sélecteur de monture
// ════════════════════════════════════════════════════════════════════
function buildSelector(){
  const grid=$('frames');
  GLASSES.forEach((g,i)=>{
    const el=document.createElement('div');
    el.className='g-tile'+(i===0?' active':'');
    el.innerHTML=`<img src="${g.thumb}" alt="" onerror="this.style.display='none'"><div class="g-tile-name">${g.name}</div>`;
    el.addEventListener('click',()=>selectGlass(i));
    grid.appendChild(el);
  });
}

async function selectGlass(idx){
  selectedIdx=idx;
  document.querySelectorAll('.g-tile').forEach((el,i)=>el.classList.toggle('active',i===idx));
  if(scene) await loadGlass(idx);
}

// ════════════════════════════════════════════════════════════════════
//  THREE.JS — scène en cm, FOV 63°
// ════════════════════════════════════════════════════════════════════
function initThree(){
  const cv=$('glCanvas');
  cv.width=W; cv.height=H;
  renderer=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});
  renderer.setClearColor(0,0);
  renderer.setSize(W,H,false);
  renderer.sortObjects=true;
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.2;

  camera=new THREE.PerspectiveCamera(VFOV,ASPECT,1,2000);
  camera.position.set(0,0,0); camera.lookAt(0,0,-1);

  scene=new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff,1.0));
  const k=new THREE.DirectionalLight(0xfff5e0,1.4); k.position.set(0,100,200); scene.add(k);
  const f=new THREE.DirectionalLight(0xe0ecff,0.6); f.position.set(-100,30,100); scene.add(f);

  const pmrem=new THREE.PMREMGenerator(renderer);
  scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
  pmrem.dispose();

  occMesh=new THREE.Mesh(
    new THREE.BufferGeometry(),
    new THREE.MeshBasicMaterial({
      colorWrite:false, depthWrite:true, side:THREE.DoubleSide,
      // Pousse l'occluder légèrement en arrière en Z pour éviter le Z-fighting
      // avec les lunettes qui touchent la peau du visage
      polygonOffset:true, polygonOffsetFactor:1.0, polygonOffsetUnits:2.0
    })
  );
  occMesh.renderOrder=0; occMesh.visible=false; occMesh.frustumCulled=false;
  scene.add(occMesh);
}

// ════════════════════════════════════════════════════════════════════
//  CHARGEMENT GLB
// ════════════════════════════════════════════════════════════════════
async function loadGlass(idx){
  if(glassLoading) return;
  glassLoading=true;
  if(glassGroup){scene.remove(glassGroup);glassGroup=null;}

  const cfg=GLASSES[idx];
  const loader=new GLTFLoader();

  try{
    const gltf=await loader.loadAsync(cfg.path);
    const model=gltf.scene;

    // Supprimer les lights/cameras parasites (Sketchfab) qui faussent la bbox
    const trash=[];
    model.traverse(n=>{ if(n.isLight||n.isCamera) trash.push(n); });
    trash.forEach(n=>n.parent?.remove(n));

    if(cfg.rotFix?.some(v=>v)) model.rotation.set(...cfg.rotFix);
    model.updateMatrixWorld(true);

    // Mesure SEULEMENT à partir des meshes visibles
    const meshBox=new THREE.Box3();
    model.traverse(n=>{
      if(n.isMesh && n.geometry){
        n.geometry.computeBoundingBox();
        const b=n.geometry.boundingBox.clone().applyMatrix4(n.matrixWorld);
        meshBox.union(b);
      }
    });
    const s0=meshBox.getSize(new THREE.Vector3());
    console.log('[GLB]', cfg.name, 'taille native:', s0.x.toFixed(3), s0.y.toFixed(3), s0.z.toFixed(3));

    // Mise à l'échelle physique : largeur réelle = frameWidth mm → cm
    // Note : PAS de templeScale (scale Z uniforme = sc). Le modèle a déjà
    // ~17cm de profondeur native (branches atteignent les oreilles). Un scale Z
    // différentiel étire les surfaces minces jusqu'à les dédoubler visuellement.
    const targetCm=cfg.mm.frameWidth/10;
    const sc=targetCm/(s0.x||1);
    model.scale.set(sc, sc, sc);
    model.updateMatrixWorld(true);

    // Recalculer bbox APRÈS scaling, toujours sur les meshes seulement
    const meshBox2=new THREE.Box3();
    model.traverse(n=>{
      if(n.isMesh && n.geometry){
        const b=n.geometry.boundingBox.clone().applyMatrix4(n.matrixWorld);
        meshBox2.union(b);
      }
    });
    const s1=meshBox2.getSize(new THREE.Vector3());
    const c1=meshBox2.getCenter(new THREE.Vector3());
    console.log('[GLB] après scaling:', s1.x.toFixed(2), s1.y.toFixed(2), s1.z.toFixed(2),'cm');

    // Auto-détection du pont : vertex le plus bas dans la bande centrale
    // en X (= point où la monture touche réellement le nez).
    // Bien plus précis que la mi-hauteur géométrique car les modèles ont
    // souvent des plaquettes ou une découpe centrale.
    const centerBand = (meshBox2.max.x - meshBox2.min.x) * 0.08;
    let bridgeY = Infinity;
    const _bv = new THREE.Vector3();
    model.traverse(n => {
      if (!n.isMesh || !n.geometry) return;
      const pa = n.geometry.attributes.position;
      if (!pa) return;
      for (let i = 0; i < pa.count; i++) {
        _bv.fromBufferAttribute(pa, i).applyMatrix4(n.matrixWorld);
        if (Math.abs(_bv.x) < centerBand && _bv.y < bridgeY) {
          bridgeY = _bv.y;
        }
      }
    });
    if (!isFinite(bridgeY)) bridgeY = (meshBox2.max.y + meshBox2.min.y) / 2;

    // Override manuel optionnel (cfg.bridgeY_mm = position absolue du pont
    // dans le modèle, en mm relatif au centre). Sinon utilise auto.
    const bridgeYFinal = (cfg.bridgeY_mm != null)
      ? cfg.bridgeY_mm / 10
      : bridgeY + (cfg.yFix||0)/10;

    console.log(`[GLB] ${cfg.name} — calibration :
      taille     : ${s1.x.toFixed(1)} × ${s1.y.toFixed(1)} × ${s1.z.toFixed(1)} cm
      pont auto  : Y = ${bridgeY.toFixed(2)} cm
      pont final : Y = ${bridgeYFinal.toFixed(2)} cm ${cfg.bridgeY_mm != null ? '(override)' : (cfg.yFix ? '(+ yFix '+cfg.yFix+'mm)' : '(auto)')}
      → si la monture est trop haute, ajoute "yFix: -10" dans la config
      → si trop basse, ajoute "yFix: +10"`);

    // Ancrage : X centré, pont au nasion, face arrière au contact
    model.position.set(
      -c1.x,
      -bridgeYFinal,
      -meshBox2.max.z + (cfg.zFix||0)/10
    );

    glassGroup=new THREE.Group();
    glassGroup.rotation.order='YXZ';
    glassGroup.renderOrder=1;
    // Caché jusqu'à convergence PnP (évite le flash au chargement)
    glassGroup.visible = PNP_init && _lastPnpErrPx < 15;
    glassGroup.add(model);
    // Forcer renderOrder=2 sur chaque mesh pour qu'ils passent APRÈS l'occluder (renderOrder=0)
    // Forcer FrontSide sur tous les matériaux : évite que la face arrière du cadre
    // soit visible à travers la face avant (effet "branche doublée" sur les
    // montures fines avec templeScale > 1).
    model.traverse(n=>{
      if(!n.isMesh) return;
      n.renderOrder=2; n.frustumCulled=false;
      const mats = Array.isArray(n.material) ? n.material : [n.material];
      mats.forEach(m=>{
        if(!m) return;
        m.side = THREE.FrontSide;
        m.depthWrite = true;
        m.depthTest  = true;
        m.needsUpdate = true;
      });
    });
    scene.add(glassGroup);


  }catch(e){
    hud('❌ GLB: '+e.message,'#e57373');
    console.error('loadGlass',e);
  }
  glassLoading=false;
}

async function initMP(){
  hud('Chargement IA…');

  if(typeof FaceMesh === 'undefined'){
    hud('❌ FaceMesh manquant','#e57373');
    return;
  }

  const base = './node_modules/@mediapipe/face_mesh/';

  faceMesh=new FaceMesh({locateFile:f=>base+f});
  faceMesh.setOptions({
    maxNumFaces:1,
    refineLandmarks:true,
    minDetectionConfidence:0.6,
    minTrackingConfidence:0.6,
  });

  faceMesh.onResults(res=>{
    if(res.multiFaceLandmarks?.length){
      _faceGoneCnt = 0;
      landmarks=res.multiFaceLandmarks[0];
      hud('✓ Visage détecté','#4caf50');
      $('faceOval').classList.add('detected','gone');
    }else{
      _faceGoneCnt++;
      landmarks=null;
      // Grace period : on ne reset l'état PnP qu'après 10 frames sans visage.
      // Pertes brèves (<340 ms) → lunettes gelées à la dernière position,
      // pas de cold-start → pas de flash/disparition au retour.
      if(_faceGoneCnt >= 10){
        if(occMesh) occMesh.visible=false;
        PNP_init = false;
        _prevLm = null;
        _quatInited = false;
        _depthInited = false;
      }
      hud('Montrez votre visage à la caméra');
      $('faceOval').classList.remove('detected','gone');
    }
  });

  await faceMesh.initialize();
  mpReady=true;
  hud('Montrez votre visage à la caméra');

  mpTimer=setInterval(async()=>{
    if(!mpReady||mpSending||$('cam').readyState<2) return;
    mpSending=true;
    try{ await faceMesh.send({image:$('cam')}); }catch(_){}
    mpSending=false;
  },34);
}

// ════════════════════════════════════════════════════════════════════
//  TRACKING 6DOF
// ════════════════════════════════════════════════════════════════════
// ─────────────────────────────────────────────────────────────────
//  PROJECTION LANDMARK → POSITION 3D (cm) — perspective réelle
//
//  Pipeline "face-attached" :
//   1. Profondeur Z (cm) calculée chaque frame depuis la distance
//      inter-iris (PD humaine canonique 6.3 cm) — voir computeFaceDepthCm().
//   2. Chaque landmark normalisé (lm.x, lm.y ∈ [0..1]) est remonté à la
//      profondeur du visage en utilisant la focale réelle de la caméra
//      THREE (FOCAL_PX), ce qui inverse exactement la projection que fait
//      le renderer → les points 3D retombent au bon pixel à l'écran.
//   3. lm.z (offset relatif au plan moyen du visage, même échelle que x)
//      ajoute une variation de profondeur par landmark : le nez ressort,
//      les oreilles reculent → vraie géométrie 3D au lieu d'un plan plat.
// ─────────────────────────────────────────────────────────────────
function computeFaceDepthCm(lm){
  // Iris L = lm 468, iris R = lm 473 (refineLandmarks:true).
  if(!lm[468] || !lm[473]) return CURRENT_DEPTH_CM;
  const dx = (lm[468].x - lm[473].x) * W;
  const dy = (lm[468].y - lm[473].y) * H;
  const pdPx = Math.hypot(dx, dy);
  if(pdPx < 4) return CURRENT_DEPTH_CM;
  // Z = focal * realSize / observedSize  (sténopé)
  const z = (FOCAL_PX * REAL_PD_CM) / pdPx;
  return Math.max(20, Math.min(150, z));
}

function project3D(lm){
  const z = CURRENT_DEPTH_CM;                  // profondeur du plan moyen
  const kxy = z / FOCAL_PX;                    // cm par pixel à cette distance
  // lm.z est dans la même échelle que lm.x (normalisé largeur) → convertir
  // en cm via la même rampe que x. Signe : lm.z < 0 = plus près de la caméra.
  const dzCm = (lm.z || 0) * W * kxy;
  return new THREE.Vector3(
     (lm.x - 0.5) * W * kxy,
    -(lm.y - 0.5) * H * kxy,
    -z - dzCm
  );
}

//   • u_i = pixel observé par MediaPipe (très précis en 2D)

// État de la pose courante (warm-start entre les frames)
const PNP_R = new Float64Array([1,0,0, 0,1,0, 0,0,1]);
const PNP_t = new Float64Array([0, 0, -50]);
let PNP_init = false;
let _lastPnpErrPx = 0;  // erreur de reprojection en px/landmark (debug)
let _dbgMode = false;   // F11 pour activer le mode debug
let _faceGoneCnt = 0;   // compteur de frames sans visage (grace period)

// ─────────────────────────────────────────────────────────────────
//  ALGÈBRE LINÉAIRE 3×3 / 6×6
// ─────────────────────────────────────────────────────────────────
function mat3mul(A, B, C){
  for (let i=0;i<3;i++) for (let j=0;j<3;j++){
    let s=0; for (let k=0;k<3;k++) s+=A[i*3+k]*B[k*3+j]; C[i*3+j]=s;
  }
}

// Rodrigues : (axis * angle) → matrice de rotation 3×3
function rodrigues(rx, ry, rz, R){
  const th2 = rx*rx + ry*ry + rz*rz;
  if (th2 < 1e-18) { R[0]=1;R[1]=0;R[2]=0; R[3]=0;R[4]=1;R[5]=0; R[6]=0;R[7]=0;R[8]=1; return; }
  const th = Math.sqrt(th2), c = Math.cos(th), s = Math.sin(th), C = 1 - c;
  const x = rx/th, y = ry/th, z = rz/th;
  R[0]=c+x*x*C;     R[1]=x*y*C-z*s;   R[2]=x*z*C+y*s;
  R[3]=y*x*C+z*s;   R[4]=c+y*y*C;     R[5]=y*z*C-x*s;
  R[6]=z*x*C-y*s;   R[7]=z*y*C+x*s;   R[8]=c+z*z*C;
}

// Cholesky 6×6 SPD : Ax = b
function solve6(A, b, x){
  const L = new Float64Array(36);
  for (let i=0;i<6;i++) for (let j=0;j<=i;j++){
    let s = A[i*6+j];
    for (let k=0;k<j;k++) s -= L[i*6+k]*L[j*6+k];
    if (i===j){ if (s < 1e-12) return false; L[i*6+i] = Math.sqrt(s); }
    else L[i*6+j] = s / L[j*6+j];
  }
  const y = new Float64Array(6);
  for (let i=0;i<6;i++){ let s=b[i]; for (let k=0;k<i;k++) s-=L[i*6+k]*y[k]; y[i]=s/L[i*6+i]; }
  for (let i=5;i>=0;i--){ let s=y[i]; for (let k=i+1;k<6;k++) s-=L[k*6+i]*x[k]; x[i]=s/L[i*6+i]; }
  return true;
}

// Erreur de reprojection pondérée avec perte de Huber (robuste aux outliers)
const HUBER_DELTA = 2.0; // pixels — résidu sous ce seuil = L2, au-dessus = L1
function huber(r2){ const r=Math.sqrt(r2); return r<=HUBER_DELTA ? r2 : 2*HUBER_DELTA*r-HUBER_DELTA*HUBER_DELTA; }
function huberW(r2){ const r=Math.sqrt(r2+1e-12); return r<=HUBER_DELTA ? 1.0 : HUBER_DELTA/r; }

function reprojErr(obs, R, t){
  let sum = 0;
  for (let i=0;i<obs.length;i++){
    const o = obs[i];
    const Wx = R[0]*o[0]+R[1]*o[1]+R[2]*o[2]+t[0];
    const Wy = R[3]*o[0]+R[4]*o[1]+R[5]*o[2]+t[1];
    const Wz = R[6]*o[0]+R[7]*o[1]+R[8]*o[2]+t[2];
    const d = -Wz;
    if (d < 1e-3) return Infinity;
    const u = FOCAL_PX*Wx/d, v = -FOCAL_PX*Wy/d;
    const ru = u - o[3], rv = v - o[4];
    sum += o[5]*huber(ru*ru + rv*rv);
  }
  return sum;
}

const _R_step = new Float64Array(9);
const _R_new  = new Float64Array(9);
const _t_new  = new Float64Array(3);
const _JtJ    = new Float64Array(36);
const _Jtr    = new Float64Array(6);
const _delta  = new Float64Array(6);

// ─────────────────────────────────────────────────────────────────
//  SOLVEUR ITÉRATIF — Levenberg-Marquardt
// ─────────────────────────────────────────────────────────────────
function solvePnP(obs, R, t, maxIters){
  let lambda = 1e-3;
  let prevErr = reprojErr(obs, R, t);

  for (let iter=0; iter<maxIters; iter++){
    for (let i=0;i<36;i++) _JtJ[i] = 0;
    for (let i=0;i<6;i++)  _Jtr[i] = 0;

    for (let i=0;i<obs.length;i++){
      const o = obs[i];
      const Px=o[0], Py=o[1], Pz=o[2], u_obs=o[3], v_obs=o[4], w=o[5];
      const RPx = R[0]*Px+R[1]*Py+R[2]*Pz;
      const RPy = R[3]*Px+R[4]*Py+R[5]*Pz;
      const RPz = R[6]*Px+R[7]*Py+R[8]*Pz;
      const Wx = RPx+t[0], Wy = RPy+t[1], Wz = RPz+t[2];
      const d  = -Wz;
      if (d < 1e-3) continue;
      const inv_d = 1/d, inv_d2 = inv_d*inv_d;
      const u = FOCAL_PX*Wx*inv_d, v = -FOCAL_PX*Wy*inv_d;
      const ru = u - u_obs, rv = v - v_obs;
      const hw = w * huberW(ru*ru + rv*rv);  // poids Huber pondéré

      // ∂π/∂W (2×3)
      const pu_x = FOCAL_PX*inv_d,         pu_z = FOCAL_PX*Wx*inv_d2;
      const pv_y = -FOCAL_PX*inv_d,        pv_z = -FOCAL_PX*Wy*inv_d2;

      // ∂(u,v)/∂δr  =  -∂π/∂W · [R·P]_×    (perturbation gauche : R←exp[δ]·R)
      const J_u_r0 = pu_z*RPy;
      const J_u_r1 = pu_x*RPz - pu_z*RPx;
      const J_u_r2 = -pu_x*RPy;
      const J_v_r0 = -pv_y*RPz + pv_z*RPy;
      const J_v_r1 = -pv_z*RPx;
      const J_v_r2 = pv_y*RPx;
      const Ju = [J_u_r0, J_u_r1, J_u_r2, pu_x, 0,    pu_z];
      const Jv = [J_v_r0, J_v_r1, J_v_r2, 0,    pv_y, pv_z];

      for (let p=0;p<6;p++){
        _Jtr[p] += hw*(Ju[p]*ru + Jv[p]*rv);
        for (let q=p;q<6;q++){
          const v2 = hw*(Ju[p]*Ju[q] + Jv[p]*Jv[q]);
          _JtJ[p*6+q] += v2; if (p!==q) _JtJ[q*6+p] += v2;
        }
      }
    }

    // Damping LM (Marquardt) sur la diagonale
    for (let i=0;i<6;i++) _JtJ[i*6+i] += lambda*(_JtJ[i*6+i] + 1e-6);
    for (let i=0;i<6;i++) _Jtr[i] = -_Jtr[i];

    if (!solve6(_JtJ, _Jtr, _delta)){ lambda *= 10; continue; }

    // Clamp du pas de rotation (anti-divergence)
    const rMag = Math.sqrt(_delta[0]*_delta[0]+_delta[1]*_delta[1]+_delta[2]*_delta[2]);
    if (rMag > 0.4){ const f = 0.4/rMag; _delta[0]*=f; _delta[1]*=f; _delta[2]*=f; }

    rodrigues(_delta[0], _delta[1], _delta[2], _R_step);
    mat3mul(_R_step, R, _R_new);
    _t_new[0] = t[0] + _delta[3]; _t_new[1] = t[1] + _delta[4]; _t_new[2] = t[2] + _delta[5];

    const newErr = reprojErr(obs, _R_new, _t_new);
    if (newErr < prevErr){
      for (let i=0;i<9;i++) R[i] = _R_new[i];
      t[0] = _t_new[0]; t[1] = _t_new[1]; t[2] = _t_new[2];
      lambda *= 0.5;
      const rel = (prevErr - newErr) / Math.max(prevErr, 1);
      prevErr = newErr;
      if (rel < 1e-4) break;
    } else {
      lambda *= 4;
      if (lambda > 1e6) break;
    }
  }
  return prevErr;
}

// Initialisation cold-start : 5-point cross product (l'ancienne méthode)
// fournit une excellente estimation initiale pour le solveur itératif.
function initPnPFromCrossProduct(lm){
  const nasion = project3D(lm[HEAD_LM.nasion]);
  const earL = project3D(lm[HEAD_LM.earL]);
  const earR = project3D(lm[HEAD_LM.earR]);
  const top  = project3D(lm[HEAD_LM.top]);
  const chin = project3D(lm[HEAD_LM.chin]);
  const xx = earR.x-earL.x, xy = earR.y-earL.y, xz = earR.z-earL.z;
  const xn = Math.hypot(xx, xy, xz) || 1;
  const ax = xx/xn, ay = xy/xn, az = xz/xn;
  const tx = top.x-chin.x, ty = top.y-chin.y, tz = top.z-chin.z;
  const tn = Math.hypot(tx, ty, tz) || 1;
  const yt_x = tx/tn, yt_y = ty/tn, yt_z = tz/tn;
  // z = x × yt
  let zx = ay*yt_z - az*yt_y, zy = az*yt_x - ax*yt_z, zz = ax*yt_y - ay*yt_x;
  const zn = Math.hypot(zx, zy, zz) || 1;
  zx/=zn; zy/=zn; zz/=zn;
  // y = z × x
  const yx = zy*az - zz*ay, yy = zz*ax - zx*az, yzc = zx*ay - zy*ax;
  PNP_R[0]=ax; PNP_R[1]=yx; PNP_R[2]=zx;
  PNP_R[3]=ay; PNP_R[4]=yy; PNP_R[5]=zy;
  PNP_R[6]=az; PNP_R[7]=yzc;PNP_R[8]=zz;
  PNP_t[0]=nasion.x; PNP_t[1]=nasion.y; PNP_t[2]=nasion.z;
  PNP_init = true;
}

const _tmpV     = new THREE.Vector3();
const _headMat  = new THREE.Matrix4();
const _glassMat = new THREE.Matrix4();
const _offsetMat= new THREE.Matrix4();
const _decPos   = new THREE.Vector3();
const _decQuat  = new THREE.Quaternion();
const _decScl   = new THREE.Vector3();
const _decEul   = new THREE.Euler(0,0,0,'YXZ');
const _finalQuat= new THREE.Quaternion();

function buildHeadMatrix(lm){
  // Lissage temporel des landmarks (IIR) — réduit bruit sub-pixel avant PnP
  if (_prevLm === null){
    _prevLm = lm.map(p => p ? {x:p.x, y:p.y, z:p.z} : null);
  } else {
    for (let i=0;i<lm.length;i++){
      const cur=lm[i], prv=_prevLm[i];
      if (!cur) continue;
      if (!prv){ _prevLm[i]={x:cur.x,y:cur.y,z:cur.z}; continue; }
      prv.x = LM_ALPHA*cur.x + (1-LM_ALPHA)*prv.x;
      prv.y = LM_ALPHA*cur.y + (1-LM_ALPHA)*prv.y;
      prv.z = LM_ALPHA*cur.z + (1-LM_ALPHA)*prv.z;
    }
  }
  const slm = _prevLm;  // landmarks lissés

  // Collecte des paires (canonical 3D, observé 2D pixels) sur landmarks lissés
  const obs = [];
  for (let i=0;i<PNP_FACE.length;i++){
    const f = PNP_FACE[i];
    const lp = slm[f[0]];
    if (!lp) continue;
    obs.push([f[1], f[2], f[3], (lp.x-0.5)*W, (lp.y-0.5)*H, f[4]]);
  }
  if (obs.length < 8) return null;

  // Cold start : cross-product 5-points donne une initialisation rapide.
  // On garde une variable pour savoir si c'est le premier appel (masquer
  // les lunettes pendant la convergence PnP initiale).
  const wasCold = !PNP_init;
  if (wasCold) { initPnPFromCrossProduct(slm); if(glassGroup) glassGroup.visible=false; }

  // 12 itérations LM. Avec warm-start, 4-5 suffisent.
  const finalErr = solvePnP(obs, PNP_R, PNP_t, 12);

  // Réafficher les lunettes dès que l'erreur est raisonnable (<15 px/lm)
  if (glassGroup && _lastPnpErrPx < 15 && !wasCold) glassGroup.visible = true;

  // Si l'erreur explose (tracking perdu), reset complet + purge lissage.
  if (!isFinite(finalErr) || finalErr > 1e8){
    _prevLm = null;
    _quatInited = false;
    if(glassGroup) glassGroup.visible = false;
    initPnPFromCrossProduct(slm);
  }

  _headMat.set(
    PNP_R[0], PNP_R[1], PNP_R[2], PNP_t[0],
    PNP_R[3], PNP_R[4], PNP_R[5], PNP_t[1],
    PNP_R[6], PNP_R[7], PNP_R[8], PNP_t[2],
    0, 0, 0, 1
  );

  _lastPnpErrPx = isFinite(finalErr) ? Math.sqrt(finalErr / obs.length) : 999;
  // Dès que l'erreur redescend sous 15 px/lm (convergé), montrer les lunettes
  if (glassGroup && _lastPnpErrPx < 15) glassGroup.visible = true;

  if (!buildHeadMatrix._logT || performance.now() - buildHeadMatrix._logT > 1500){
    buildHeadMatrix._logT = performance.now();
    console.log(`[PnP] reproj err = ${_lastPnpErrPx.toFixed(2)} px/lm (${obs.length} pts)`);
  }
  return _headMat;
}

function track(lm){
  if(!glassGroup) return;

  // ── 0. Profondeur Z métrique du visage (cm) ─────────────────
  //   Calculée à partir de la distance inter-iris en pixels et de la
  //   PD canonique 6.3 cm via le modèle sténopé. C'est CETTE valeur qui
  //   transforme l'overlay 2D en véritable AR : la perspective utilisée
  //   pour positionner la tête correspond exactement à celle du renderer,
  //   donc les lunettes se déplacent au bon "rythme" que le visage et
  //   semblent physiquement attachées au lieu de flotter.
  const rawDepth = computeFaceDepthCm(lm);
  if (!_depthInited){ CURRENT_DEPTH_CM = rawDepth; _depthInited = true; }
  else CURRENT_DEPTH_CM = _depthFilter.f(rawDepth, performance.now());

  if(!track._logT || performance.now() - track._logT > 1500){
    track._logT = performance.now();
    console.log(`[AR] Z=${CURRENT_DEPTH_CM.toFixed(1)}cm (raw=${rawDepth.toFixed(1)})  focal=${FOCAL_PX.toFixed(0)}px`);
  }

  // ── 1. Repère tête (rotation PnP) ───────────────────────────
  const headMat = buildHeadMatrix(lm);
  if (!headMat) return;

  // ── 2. Échelle (largeur inter-oreilles) ──────────────────────
  _tmpV.subVectors(project3D(lm[HEAD_LM.earR]), project3D(lm[HEAD_LM.earL]));
  let sc = _tmpV.length() / 14.0;
  if (!isFinite(sc) || sc < 0.1) sc = 1.0;
  sc = Math.max(0.85, Math.min(1.20, sc));

  // ── 3. Rotation : PnP → SLERP (pas de Euler, pas de gimbal) ─
  headMat.decompose(_decPos, _decQuat, _decScl);
  if (!_quatInited) { _smoothQuat.copy(_decQuat); _quatInited = true; }
  else _smoothQuat.slerp(_decQuat, SLERP_ALPHA);

  // ── 4. Position : NASION LOCK — ancrage direct sur lm 6 ─────
  //   La translation PnP peut dériver ; en liant la position
  //   DIRECTEMENT au nasion lissé, on garantit zéro séparation
  //   entre le pont nasal et la monture, quelle que soit la pose.
  const nasLm = (_prevLm && _prevLm[6]) ? _prevLm[6] : lm[6];
  const nasPos = project3D(nasLm);

  // Offset dans le repère local de la tête → rotation vers world
  _tmpV.set(0, GLASSES_OFFSET_Y_CM, GLASSES_OFFSET_Z_CM);
  _tmpV.applyQuaternion(_smoothQuat);

  const t = performance.now();
  const fx = KF.tx.update(F.tx.f(nasPos.x + _tmpV.x, t));
  const fy = KF.ty.update(F.ty.f(nasPos.y + _tmpV.y, t));
  const fz = KF.tz.update(F.tz.f(nasPos.z + _tmpV.z, t));
  const fsc = F.sc.f(sc, t);

  // ── 5. Appliquer ─────────────────────────────────────────────
  glassGroup.position.set(fx, fy, fz);
  glassGroup.quaternion.copy(_smoothQuat);
  glassGroup.scale.setScalar(fsc);

  if (_dbgMode) drawDebug(lm, {fx, fy, fz, nasPos, sc});
  updateOcc(lm);
}

// ─── Debug overlay (F11) ──────────────────────────────────────────
const _dbgCtx = (() => {
  const c = document.getElementById('dbgCanvas');
  return c ? c.getContext('2d') : null;
})();

function worldToScreen(wx, wy, wz){
  const d = -wz;
  if (d < 0.01) return null;
  return { x: wx * FOCAL_PX / d + W/2, y: -wy * FOCAL_PX / d + H/2 };
}

function drawDebug(lm, info){
  if (!_dbgCtx) return;
  _dbgCtx.clearRect(0, 0, W, H);
  _dbgCtx.font = 'bold 11px monospace';

  const dot = (x, y, r, color, label) => {
    _dbgCtx.beginPath();
    _dbgCtx.arc(x, y, r, 0, Math.PI*2);
    _dbgCtx.fillStyle = color;
    _dbgCtx.fill();
    _dbgCtx.fillStyle = '#fff';
    _dbgCtx.fillText(label, x+r+2, y+4);
  };

  // Landmarks clés (espace vidéo normalisé → pixels canvas)
  const landmarks = [
    [6,   '#00ff44', 'Nasion (6)'],
    [168, '#4488ff', 'Sellion (168)'],
    [1,   '#ffaa00', 'Nez tip (1)'],
    [33,  '#ff4488', 'CornerR (33)'],
    [263, '#ff4488', 'CornerL (263)'],
    [109, '#ff88ff', 'TempeR (109)'],
    [338, '#ff88ff', 'TempeL (338)'],
    [234, '#ffff44', 'EarR (234)'],
    [454, '#ffff44', 'EarL (454)'],
  ];
  for (const [idx, color, label] of landmarks){
    const p = lm[idx]; if (!p) continue;
    dot(p.x * W, p.y * H, 5, color, label);
  }

  // Point d'ancrage lunettes (3D → screen)
  const gs = worldToScreen(info.fx, info.fy, info.fz);
  if (gs) dot(gs.x, gs.y, 7, '#ff0000', 'GLB anchor');

  // Nasion direct
  const ns = worldToScreen(info.nasPos.x, info.nasPos.y, info.nasPos.z);
  if (ns) {
    _dbgCtx.beginPath(); _dbgCtx.arc(ns.x, ns.y, 5, 0, Math.PI*2);
    _dbgCtx.strokeStyle = '#00ff44'; _dbgCtx.lineWidth = 2; _dbgCtx.stroke();
    _dbgCtx.fillStyle = '#fff'; _dbgCtx.fillText('Nasion 3D', ns.x+7, ns.y+4);
  }

  // Infos texte (coin haut gauche — espace non-mirrored donc bas-gauche visuellement)
  const lines = [
    `PnP err : ${_lastPnpErrPx.toFixed(2)} px/lm`,
    `Depth   : ${CURRENT_DEPTH_CM.toFixed(1)} cm`,
    `Scale   : ${info.sc.toFixed(3)}`,
    `Anchor  : (${info.fx.toFixed(1)}, ${info.fy.toFixed(1)}, ${info.fz.toFixed(1)})`,
    `OffY=${GLASSES_OFFSET_Y_CM} OffZ=${GLASSES_OFFSET_Z_CM}`,
    `SLERP α=${SLERP_ALPHA}  LM α=${LM_ALPHA}`,
  ];
  _dbgCtx.fillStyle = 'rgba(0,0,0,0.65)';
  _dbgCtx.fillRect(W-280, 8, 272, lines.length*16+8);
  _dbgCtx.fillStyle = '#c0ffc0';
  lines.forEach((l, i) => _dbgCtx.fillText(l, W-276, 22 + i*16));
}

function ensureOccIndex(){
  if(OCC_IDX) return;
  const tess = (typeof FACEMESH_TESSELATION !== 'undefined') ? FACEMESH_TESSELATION
              : (window.FACEMESH_TESSELATION || null);
  if(tess && tess.length){
    OCC_IDX = buildFaceMeshTriangles(tess);
    console.log('[OCC] Mesh facial complet :', OCC_N_VERTS, 'vertices,',
                OCC_IDX.length/3|0, 'triangles');
  }else{
    // Repli : fan triangulé sur l'ovale facial (ancien comportement)
    const n = OVAL_FALLBACK.length;
    const a = [];
    for(let i=0;i<n;i++) a.push(OCC_N_VERTS, OVAL_FALLBACK[i], OVAL_FALLBACK[(i+1)%n]);
    OCC_IDX = new Uint32Array(a);
    console.warn('[OCC] FACEMESH_TESSELATION indisponible — repli ovale facial');
  }
}

function updateOcc(lm){
  ensureOccIndex();
  // Buffer: tous les 468 vertices du mesh facial + 1 centroïde (pour fallback)
  const vc = OCC_N_VERTS + 1;
  if(!occBuf || occBuf.length !== vc*3) occBuf = new Float32Array(vc*3);
  const z = CURRENT_DEPTH_CM;
  const kxy = z / FOCAL_PX;
  let cx=0, cy=0, cz=0, n=0;
  for(let i=0;i<OCC_N_VERTS;i++){
    const p = lm[i];
    if(!p){ occBuf[i*3]=0; occBuf[i*3+1]=0; occBuf[i*3+2]=-z; continue; }
    const dzCm = (p.z||0) * W * kxy;
    const px = (p.x-0.5) * W * kxy;
    const py = -(p.y-0.5) * H * kxy;
    const pz = -z - dzCm;
    occBuf[i*3]=px; occBuf[i*3+1]=py; occBuf[i*3+2]=pz;
    cx+=px; cy+=py; cz+=pz; n++;
  }

  // Centroïde (utilisé par le fan de repli)
  occBuf[OCC_N_VERTS*3]   = n ? cx/n : 0;
  occBuf[OCC_N_VERTS*3+1] = n ? cy/n : 0;
  occBuf[OCC_N_VERTS*3+2] = n ? cz/n : -z;

  const geo = occMesh.geometry;
  if(!occInit){
    geo.setAttribute('position', new THREE.BufferAttribute(occBuf.slice(),3));
    geo.setIndex(new THREE.BufferAttribute(OCC_IDX,1));
    occInit = true;
  }else{
    geo.attributes.position.array.set(occBuf);
    geo.attributes.position.needsUpdate = true;
  }
  geo.computeBoundingSphere();
  occMesh.visible = true;
}

// ════════════════════════════════════════════════════════════════════
//  BOUCLE
// ════════════════════════════════════════════════════════════════════
function loop(){
  animId=requestAnimationFrame(loop);
  if(landmarks) track(landmarks);
  renderer.clear();
  renderer.render(scene,camera);
}

// ════════════════════════════════════════════════════════════════════
//  ÉVÉNEMENTS UI
// ════════════════════════════════════════════════════════════════════
$('startBtn').addEventListener('click',async()=>{
  $('welcome').style.display='none';
  $('app').classList.add('on');
  $('loading').classList.add('on');

  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user',width:{ideal:W},height:{ideal:H}},audio:false
    });
    $('cam').srcObject=stream;
    await new Promise((ok,fail)=>{$('cam').onloadedmetadata=ok;setTimeout(()=>fail(new Error('Timeout caméra')),15000);});
    await $('cam').play();
    $('loading').classList.remove('on');

    initThree();
    await loadGlass(selectedIdx);
    loop();
    initMP().catch(e=>{
      hud('❌ initMP: '+e.message,'#e57373');
      console.error(e);
    });

  }catch(e){
    console.error(e);
    $('loadMsg').style.color='#e57373';
    $('loadMsg').textContent='❌ '+(e.message||'Erreur');
    document.querySelector('.spinner').style.display='none';
  }
});

$('stopBtn').addEventListener('click',()=>{
  if(animId){cancelAnimationFrame(animId);animId=null;}
  if(mpTimer){clearInterval(mpTimer);mpTimer=null;}
  if(faceMesh){try{faceMesh.close();}catch(_){}faceMesh=null;}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  landmarks=null; occInit=false; occBuf=null; mpReady=false; PNP_init=false;
  $('cam').srcObject=null;
  if(renderer){renderer.dispose();renderer=null;}
  glassGroup=null; occMesh=null; scene=null; camera=null;
  $('app').classList.remove('on');
  $('welcome').style.display='';
  $('loadMsg').style.color=''; $('loadMsg').textContent='Démarrage caméra…';
  $('loading').classList.remove('on');
});

$('captureBtn').addEventListener('click',()=>{
  const out=document.createElement('canvas');
  out.width=W; out.height=H;
  const ctx=out.getContext('2d');
  ctx.save(); ctx.translate(W,0); ctx.scale(-1,1);
  ctx.drawImage($('cam'),0,0,W,H);
  ctx.drawImage($('glCanvas'),0,0,W,H);
  ctx.restore();
  const a=document.createElement('a');
  a.download=`NOA-${GLASSES[selectedIdx].name}-${Date.now()}.png`;
  a.href=out.toDataURL('image/png'); a.click();
});

$('confirmBtn').addEventListener('click',()=>{
  const t=$('toast');
  t.textContent=`✓ ${GLASSES[selectedIdx].name} sélectionnée`;
  t.style.display='block';
  setTimeout(()=>t.style.display='none',3500);
});


buildSelector();

// F11 : mode debug (points anatomiques + infos PnP en overlay)
document.addEventListener('keydown', e => {
  if (e.key === 'F11') {
    e.preventDefault();
    _dbgMode = !_dbgMode;
    const c = document.getElementById('dbgCanvas');
    if (c) {
      c.style.display = _dbgMode ? 'block' : 'none';
      if (!_dbgMode && _dbgCtx) _dbgCtx.clearRect(0, 0, W, H);
    }
    console.log(`[DEBUG] mode debug : ${_dbgMode ? 'ON' : 'OFF'}`);
  }
});
