# N.O.A — serveur de dossiers, de la flotte et du tableau de bord.
# Lancer depuis ce dossier :  docker compose up -d --build
# Les secrets sont dans .env (voir .env.exemple), jamais dans ce fichier.
services:
  noa:
    build:
      context: ../..                  # la racine du dépôt : l'image embarque aussi le tableau de bord
      dockerfile: serveur/Dockerfile
    restart: unless-stopped          # revient seul après un redémarrage de la machine
    environment:
      NOA_CLE_BORNE:   ${NOA_CLE_BORNE:?définir NOA_CLE_BORNE dans .env}
      # Comptes du tableau de bord (au moins un des deux modes ; voir .env.exemple)
      NOA_COMPTES:     ${NOA_COMPTES:-}
      NOA_ADMIN_UTILISATEUR: ${NOA_ADMIN_UTILISATEUR:-}
      NOA_ADMIN_MDP:   ${NOA_ADMIN_MDP:-}
      NOA_OPTICIEN_UTILISATEUR: ${NOA_OPTICIEN_UTILISATEUR:-}
      NOA_OPTICIEN_MDP: ${NOA_OPTICIEN_MDP:-}
      NOA_OPTICIEN_BOUTIQUE: ${NOA_OPTICIEN_BOUTIQUE:-}
      NOA_MDP_ATELIER: ${NOA_MDP_ATELIER:-}          # ancien dispositif, ignoré dès qu'un vrai compte existe
      NOA_ORIGINES:    ${NOA_ORIGINES:-}
      NOA_PURGE_JOURS: ${NOA_PURGE_JOURS:-30}
      # SMS de confirmation de commande (voir .env.exemple) : sans fournisseur, rien n'est envoyé
      NOA_SMS_FOURNISSEUR: ${NOA_SMS_FOURNISSEUR:-aucun}
      NOA_SMS_ORANGE_CLIENT_ID: ${NOA_SMS_ORANGE_CLIENT_ID:-}
      NOA_SMS_ORANGE_CLIENT_SECRET: ${NOA_SMS_ORANGE_CLIENT_SECRET:-}
      NOA_SMS_ORANGE_EXPEDITEUR: ${NOA_SMS_ORANGE_EXPEDITEUR:-}
      NOA_SMS_TWILIO_SID: ${NOA_SMS_TWILIO_SID:-}
      NOA_SMS_TWILIO_TOKEN: ${NOA_SMS_TWILIO_TOKEN:-}
      NOA_SMS_TWILIO_DE: ${NOA_SMS_TWILIO_DE:-}
      NOA_SMS_MAX_HEURE: ${NOA_SMS_MAX_HEURE:-60}
      NOA_SMS_MAX_NUMERO_JOUR: ${NOA_SMS_MAX_NUMERO_JOUR:-3}
    volumes:
      - donnees:/donnees             # base, photos, sauvegardes : tout ce qui doit survivre
    expose:
      - "8080"                       # joignable seulement par Caddy, jamais depuis Internet
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }   # les journaux ne remplissent pas le disque

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [noa]
    ports:
      - "80:80"
      - "443:443"                    # le HTTPS (certificat obtenu et renouvelé tout seul)
    environment:
      NOA_DOMAINE: ${NOA_DOMAINE:?définir NOA_DOMAINE dans .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  donnees:
  caddy_data:
  caddy_config:
