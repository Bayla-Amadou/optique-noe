# N.O.A — serveur de dossiers, de la flotte et du tableau de bord.
# Lancer depuis ce dossier :  docker compose up -d --build
# Les secrets sont dans .env (voir .env.exemple), jamais dans ce fichier.
services:
  noa:
    build:
      context: ../..                  # la racine du dépôt : l'image embarque aussi le tableau de bord
      dockerfile: serveur/Dockerfile
    restart: unless-stopped          # revient seul après un redémarrage de la machine
    environment:
      NOA_CLE_BORNE:   ${NOA_CLE_BORNE:?définir NOA_CLE_BORNE dans .env}
      NOA_MDP_ATELIER: ${NOA_MDP_ATELIER:?définir NOA_MDP_ATELIER dans .env}
      NOA_ORIGINES:    ${NOA_ORIGINES:-}
      NOA_PURGE_JOURS: ${NOA_PURGE_JOURS:-30}
    volumes:
      - donnees:/donnees             # base, photos, sauvegardes : tout ce qui doit survivre
    expose:
      - "8080"                       # joignable seulement par Caddy, jamais depuis Internet
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }   # les journaux ne remplissent pas le disque

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [noa]
    ports:
      - "80:80"
      - "443:443"                    # le HTTPS (certificat obtenu et renouvelé tout seul)
    environment:
      NOA_DOMAINE: ${NOA_DOMAINE:?définir NOA_DOMAINE dans .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  donnees:
  caddy_data:
  caddy_config:
